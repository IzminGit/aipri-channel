name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎日 05:17 JST（放送日の切替直後）にプレイリストを更新
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch playlists from YouTube Data API
        if: github.event_name != 'pull_request'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run fetch-data

      - name: Commit updated catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/data/catalog.json; then
            echo "番組データに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          git commit -m "chore(data): プレイリスト情報を更新"
          git push

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}/

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
